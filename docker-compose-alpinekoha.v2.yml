services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: koha_kohadev
      MYSQL_USER: koha_kohadev
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  memcached:
    image: memcached:alpine
    command: ["-m", "64"]

  rabbitmq:
    image: rabbitmq:3-management-alpine

  koha:
    build:
      context: .
      dockerfile: Dockerfile-Alpine.v2
      target: prod-runtime
    image: kosson/koha-alpine:25.11.06-1-prod
    depends_on:
      db:
        condition: service_healthy
      memcached:
        condition: service_started
      rabbitmq:
        condition: service_started
    ports:
      - "8080:8080"
      - "8081:8081"
      - "5000:5000"
      - "5001:5001"
    environment:
      KOHA_INSTANCE: kohadev
      KOHA_DB_HOST: db
      DB_HOSTNAME: db
      DB_USER: koha_kohadev
      DB_NAME: koha_kohadev
      DB_PASSWORD: password
      KOHA_TARGET: prod-runtime
      KOHA_PATH: /kohadevbox/koha
      BUILD_DIR: /kohadevbox
      KOHA_OPAC_PORT: "8080"
      KOHA_INTRANET_PORT: "8081"
      ELASTICSEARCH_SERVER: os01:9200
      MESSAGE_BROKER_HOST: rabbitmq
      MESSAGE_BROKER_PORT: "5672"
      MESSAGE_BROKER_USER: guest
      MESSAGE_BROKER_PASS: guest
      KOHA_ALPINE_SKIP_YARN_INSTALL: "yes"
      KOHA_ALPINE_SKIP_GIT_SETUP: "yes"
      KOHA_ALPINE_SKIP_L10N: "yes"
      KOHA_ALPINE_SKIP_ELASTICSEARCH_WAIT: "yes"
      KOHA_ALPINE_SKIP_RUNTIME_COPY: "no"
      KOHA_ALPINE_SKIP_DEBIAN_SCRIPTS: "no"
      SKIP_RUNTIME_ASSET_COPY: "no"
      KOHA_ENABLE_PLACK: "yes"
      KOHA_ENABLE_WORKER: "yes"
    volumes:
      - ./koha:/kohadevbox/koha:ro
      - ./files-alpine:/build/files-alpine:ro
      - koha_logs:/var/log/koha
      - koha_var_lib:/var/lib/koha

volumes:
  db_data:
  koha_logs:
  koha_var_lib:
