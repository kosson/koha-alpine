services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: koha_kohadev
      MYSQL_USER: koha_kohadev
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  koha:
    build:
      context: .
      dockerfile: Dockerfile.alpine
    image: koha-alpine:fixed
    depends_on:
      db:
        condition: service_healthy
    environment:
      KOHASITE: kohadev
      DB_HOST: db
      MYSQL_PASS: password
      TIMEZONE: Europe/Bucharest
      KOHADEVBOX: /kohadevbox/koha
    volumes:
      # Mount your local Koha checkout to /kohadevbox/koha
      - /media/expansion/DEVELOPMENT/KOHA-DOCKER-SOLUTIONS/koha:/kohadevbox/koha:ro
      # Or if you keep it inside koha-alpine folder, adjust path:
      # - ../koha:/kohadevbox/koha:ro
      - koha_log:/var/log/koha
      - koha_run:/var/run/koha
    ports:
      - "8080:5000"   # OPAC + Staff share same Plack in this simple setup
      - "8081:5000"   # Alias if you need second mapping
    # IMPORTANT: override entrypoint to use fixed run.sh
    # entrypoint: /usr/local/bin/run.sh

volumes:
  db_data:
  koha_log:
  koha_run:
