services:
    koha:
        image: ${KOHA_ALPINE_PROD_IMAGE_TAG:-kosson/koha-alpine-prod:${KOHA_RELEASE_VERSION:?KOHA_RELEASE_VERSION must be set}}
        build:
            context: .
            dockerfile: Dockerfile-Alpine
            target: prod-runtime
            args:
                KOHA_GIT_URL: ${KOHA_RELEASE_GIT_URL:-https://git.koha-community.org/Koha-community/Koha.git}
                KOHA_GIT_REF: ${KOHA_RELEASE_REF:?KOHA_RELEASE_REF must be a release tag or commit SHA}
                KOHA_GIT_DEPTH: ${KOHA_RELEASE_GIT_DEPTH:-1}
                KOHA_VERSION: ${KOHA_RELEASE_VERSION:?KOHA_RELEASE_VERSION must be set}
        # Replace the development source bind mount inherited from the base file.
        volumes: !override
            - ${OPENSEARCH_CA_CERT:-/dev/null}:/kohadevbox/opensearch-root-ca.pem:ro
            - ./files-alpine/mariadb-ssl:/etc/mysql/ssl:ro
        environment:
            COVERAGE: ""
            CPAN: "no"
            EXTRA_CPAN: ""
            EXTRA_APT: ""
            KOHA_CI_INCREMENTAL_RUN_REPO_URL: ""
            KOHA_CI_INCREMENTAL_RUNS: ""
            KOHA_CI_INCREMENTAL_RUNS_REPORT: ""
            KOHA_CI_INCREMENTAL_RUNS_TOKEN: ""
            SKIP_CYPRESS_CHOWN: "yes"
            SKIP_YARN_INSTALL: "yes"
            KOHA_IMAGE: ${KOHA_RELEASE_VERSION:?KOHA_RELEASE_VERSION must be set}
            LOAD_DEMO_DATA: ${KOHA_PROD_LOAD_DEMO_DATA:-no}
